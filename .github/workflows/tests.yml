name: Offline tests

# Runs the offline unit tests only. Trained weights, Qwen, Imgflip and OpenAI
# are all mocked in tests/; nothing here downloads weights or calls external APIs.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Make an accidental model download or paid API call fail fast instead of running.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only PyTorch wheel; the default Linux wheel pulls several GB of CUDA libraries.
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.7,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v
